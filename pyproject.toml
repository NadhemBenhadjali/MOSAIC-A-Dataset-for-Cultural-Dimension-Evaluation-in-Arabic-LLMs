[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-arabic-cultural-eval"
version = "0.1.0"
description = "MOSAIC dataset and evaluation code for Arabic LLM cultural dimensions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "tqdm>=4.66",
    "torch>=2.1",
    "transformers>=4.44",
    "huggingface-hub>=0.24",
    "bitsandbytes>=0.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
